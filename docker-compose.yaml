services:
  flight-search-be:
    container_name: flight-search-be-app
    build: ./backend
    restart: on-failure:5
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"

  
  flight-search-fe:
    container_name: flight-search-fe-app
    build: ./frontend
    restart: on-failure:5
    env_file:
      - ./frontend/.env
    depends_on:
      - flight-search-be
    ports:
      - "4173:4173"

    